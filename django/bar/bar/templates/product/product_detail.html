{% extends 'base.html' %}

{% block title %}商品詳細{% endblock title %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 32rem;">
        <div class="card-body p-4 product-card">
            <h2 class="card-title mb-3">{{ object.name }}</h2>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="text-secondary">{{ object.category }}</span>
                <span class="fs-4 fw-bold">{{ object.price }}円</span>
            </div>

            <label for="quantity" class="form-label">数量</label>
            <select id="quantity" name="quantity" class="form-select mb-3">
                {% for i in quantity_range %}
                <option value="{{ i }}">{{ i }}個</option>
                {% endfor %}
            </select>

            <div class="d-grid gap-2">
                <button
                    type="button"
                    onclick="addToCart({{ object.id }}, document.getElementById('quantity').value)"
                    class="btn btn-dark mt-auto">
                    カートに入れる
                </button>
                <a href="{% url 'product' %}" class="btn btn-outline-secondary">
                    商品一覧に戻る
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
