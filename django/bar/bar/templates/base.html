<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock title %}BAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navber-dark bg-success sticky-top">
        <h2 class="mx-5">BAR</h2>
        <div class="navber-nav d-flex flex-row ms-auto">
        <a class="nav-link mx-3" href="{% url 'product' %}">商品一覧</a>
        <a class="nav-link mx-3" href="{% url 'cart' %}">カート</a>
        </div>
        <div class="p-4">
        <h1>{% block h1 %}{% endblock %}</h1>
    </nav>
    {% block content %}{% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
<script>
    function addToCart(productID, quantity) {
        fetch('/cart/add/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                product_id: productID,
                quantity: quantity
            })
        })
            .then(response => response.json())
            .then(data => {
                console.log('保存できた', data);
                // alert('カートに追加しました');
                window.location.href = "/product/";
            })
    }
    function updateCart(product_Id, quantity) {
        fetch('/cart/update/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                product_id: product_Id,
                quantity: quantity
            })
        })
            .then(response => response.json())
            .then(data => {
                location.reload(); // ページを再読み込みする
            });
    }
    function removeFromCart(productId) {
        const confirmation = confirm('本当に削除しますか？');
        if (!confirmation) {
            return;  // キャンセルされたら、ここで処理を止める
        }
        fetch('/cart/remove/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application_json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                product_id: productId
            })
        })
            .then(response => response.json())
            .then(data => {
                location.reload();
            });
    }
    // データそのものの扱い
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>

</html>
